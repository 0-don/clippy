[package]
name = "clippy"
version = "1.7.7"
description = "Clipboard Manager built with Rust & Typescript"
authors = ["0-don"]
license = "MIT"
repository = "https://github.com/0-don/clippy"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [".", "migration", "entity", "common"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
entity = { path = "entity" }
migration = { path = "migration" }
common = { path = "common" }

tauri = { version = "2", features = [
  "macos-private-api",
  "devtools",
  "tray-icon",
] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard = { git = "https://github.com/0-don/tauri-plugin-clipboard", branch = "wayland-support" }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
log = "0"

# Native window glass: acrylic on Windows (10 + 11, incl. 24H2 where the newer
# DWM system-backdrop API doesn't render through WebView2) + liquid glass/vibrancy
# on macOS. Rounded corners on Win11 are set separately via windows-sys DWM.
window-vibrancy = "0.6"
global-hotkey = { git = "https://github.com/0-don/global-hotkey", branch = "unified-wayland" } # tauri-plugin-global-hotkey

sea-orm = "2"
uuid = { version = "1", features = ["v7"] }
tokio = { version = "1", features = ["full"] }
rayon = "1"
serde = "1"
serde_json = "1"

dotenvy = "0"
chrono = "0"

# pattern replace
regex = "1"

# keyboard input
# xdg_desktop routes Wayland input through the RemoteDesktop portal, which GNOME
# and KDE implement; the wlroots-only virtual-keyboard protocol does not cover them.
enigo = { git = "https://github.com/0-don/enigo", rev = "8575b177833318e4e18300cc541027f1877f2edc", default-features = false, features = [
  "x11rb",
  "xdg_desktop",
  "smol",
  "platform_specific",
] }

# image
image = "0"
base64 = "0"

# file mime parser
infer = "0"
mime_guess = "2"
tree_magic_mini = "3"
urlencoding = "2"

# clipboard sync
google-drive3 = { version = "7", features = ["yup-oauth2"] }
http-body-util = "0"

# cipher
ring = "0"

# caching
moka = { version = "0", features = ["sync"] }

# ocr
ocr-rs = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Reads _NET_ACTIVE_WINDOW to remember which window to paste into.
x11rb = "0"
# Not used directly: enables the StatusNotifierItem backend on the tray-icon
# that tauri pulls in, so the tray reports left clicks.
tray-icon = { version = "0", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
# Attach to the parent terminal's console (if any) so the GUI release build
# can print logs when launched from a terminal. See attach_parent_console().
# Pinned: HWND became a pointer in 0.60, and "0" resolves back to a release
# where it is still an isize, so `is_null` does not exist.
windows-sys = { version = "0", features = [
  "Win32_System_Console",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  # Recording and re-activating the window to paste into.
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Recording and re-activating the application to paste into.
objc2 = "0"
objc2-app-kit = { version = "0", default-features = false, features = [
  "std",
  "NSEvent",
  "NSRunningApplication",
  "NSResponder",
  "NSWorkspace",
] }
objc2-foundation = { version = "0", default-features = false, features = [
  "std",
] }

[profile.release]
# panic = "abort"
# codegen-units = 1
# lto = true
# opt-level = "s"
# strip = true
